// GitHub connector contract: repository contents.
syntax = "proto3";

package kei.connectors.github.v1;

import "kei/contracts/v1/options.proto";

option go_package = "github.com/HaikeiLabs/kei-connector-contracts/gen/go/kei/connectors/github/v1;github";

// PutContentsRequest creates or updates one file in a GitHub repository via
// the Contents API. content carries the base64-encoded file bytes; sha is set
// only when replacing an existing file.
message PutContentsRequest {
  string owner = 1;
  string repository = 2;
  string path = 3;
  string message = 4;
  string content = 5;
  optional string branch = 6;
  optional string sha = 7;

  option (kei.contracts.v1.operation) = {
    id: "github.contents.put"
    connector: "github"
    class: OPERATION_CLASS_WRITE
    http_method: "PUT"
    path_template: "/repos/{owner}/{repository}/contents/{path}"
    scopes: ["contents:write"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
  };
}

// ContentFile models the file entry GitHub echoes back after a put.
message ContentFile {
  string name = 1;
  string path = 2;
  string sha = 3;
  string html_url = 4;
  optional string download_url = 5;
}

// CommitSummary models the commit a put created.
message CommitSummary {
  string sha = 1;
  string html_url = 2;
}

// PutContentsResponse models the subset of the Contents API put response the
// contract needs. It is filled by JSON unmarshal of the provider response.
message PutContentsResponse {
  ContentFile content = 1;
  CommitSummary commit = 2;
}
