// GitHub connector contract.
//
// This file is the toolchain sample: one operation proving that a request
// message can declare its operation contract, that the contract survives
// code generation into every supported language, and that a registry can
// walk the compiled descriptors to answer "what operations exist".
syntax = "proto3";

package kei.connectors.github.v1;

import "kei/contracts/v1/options.proto";

option go_package = "github.com/HaikeiLabs/kei-connector-contracts/gen/go/kei/connectors/github/v1;github";
// GitHub connector and its connection kinds. A user's own OAuth token
// (reused from SSO) or a fine-grained personal access token configured by an
// admin; both go on the wire as a bearer token.
option (kei.contracts.v1.connector) = {
  id: "github"
  base_url: "https://api.github.com"
  connections: [
    {
      name: "user_oauth"
      kind: CONNECTION_KIND_HTTP_BEARER
      auth_method: "sso_reuse"
      account_model: ACCOUNT_MODEL_PER_USER
    },
    {
      name: "pat"
      kind: CONNECTION_KIND_HTTP_BEARER
      auth_method: "secret_ref"
      account_model: ACCOUNT_MODEL_SHARED
      setup_fields: [{name: "token" type: "string" pattern: "^\\S+$" secret: true}]
    }
  ]
};
