// GitHub connector contract: pull requests.
syntax = "proto3";

package kei.connectors.github.v1;

import "kei/contracts/v1/options.proto";

option go_package = "github.com/HaikeiLabs/kei-connector-contracts/gen/go/kei/connectors/github/v1;github";

// GetPullRequestRequest reads a single pull request from a GitHub repository.
message GetPullRequestRequest {
  string owner = 1;
  string repository = 2;
  int64 pull_number = 3;

  option (kei.contracts.v1.operation) = {
    id: "github.pulls.get"
    connector: "github"
    class: OPERATION_CLASS_READ
    http_method: "GET"
    path_template: "/repos/{owner}/{repository}/pulls/{pull_number}"
    scopes: ["pulls:read"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
  };
}

// GetPullRequestResponse models the subset of the GitHub pull request payload
// the contract needs. It is filled by JSON unmarshal of the provider response.
message GetPullRequestResponse {
  int64 id = 1;
  int64 number = 2;
  string title = 3;
  string state = 4;
  optional string body = 5;
  string html_url = 6;
  bool draft = 7;
  optional string merged_at = 8;
}
