// GitHub connector contract: check runs.
syntax = "proto3";

package kei.connectors.github.v1;

import "kei/contracts/v1/options.proto";

option go_package = "github.com/HaikeiLabs/kei-connector-contracts/gen/go/kei/connectors/github/v1;github";

// ListCheckRunsRequest lists the check runs of one commit ref of a GitHub
// repository. The ref is the provider's path form without the refs/ prefix
// (heads/main); it may contain slashes, so it renders as multiple path
// segments. The contract models the page size and page number of the query
// parameters.
message ListCheckRunsRequest {
  string owner = 1 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];
  string repository = 2 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];
  string ref = 3 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH, multi_segment: true}];
  optional int32 per_page = 4;
  optional int32 page = 5;

  option (kei.contracts.v1.operation) = {
    id: "github.checks.runs.list"
    connector: "github"
    class: OPERATION_CLASS_READ
    http_method: "GET"
    path_template: "/repos/{owner}/{repository}/commits/{ref}/check-runs"
    scopes: ["checks:read"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
    method_name: "ListCheckRuns"
    connections: ["user_oauth", "pat"]
    resource_template: "repos/{owner}/{repository}"
    cursor_field: "page"
    next_cursor_field: "next_page"
    semantics: {action: SEMANTIC_ACTION_READ resource_type: "check_run" version: 1}
    errors: [
      {status: 401 kind: ERROR_KIND_UNAUTHORIZED},
      {status: 403 kind: ERROR_KIND_FORBIDDEN},
      {status: 404 kind: ERROR_KIND_NOT_FOUND},
      {status: 429 kind: ERROR_KIND_RATE_LIMITED retryable: true}
    ]
  };
}

// CheckRunSummary models the subset of each check run entry a list response
// carries. It is filled by JSON unmarshal of the provider response.
message CheckRunSummary {
  int64 id = 1;
  string name = 2;
  string head_sha = 3;
  string status = 4;
  optional string conclusion = 5;
  string html_url = 6;
}

// ListCheckRunsResponse wraps the check run entries of a list response. The
// provider returns the entries under check_runs with a total_count. next_page
// carries the next page number from the Link header. It is filled by JSON
// unmarshal of the provider response.
message ListCheckRunsResponse {
  repeated CheckRunSummary check_runs = 1;
  optional int64 total_count = 2;
  optional int64 next_page = 3;
}
