// GitHub connector contract.
//
// This file is the toolchain sample: one operation proving that a request
// message can declare its operation contract, that the contract survives
// code generation into every supported language, and that a registry can
// walk the compiled descriptors to answer "what operations exist".
syntax = "proto3";

package kei.connectors.github.v1;

import "kei/contracts/v1/options.proto";
import "kei/connectors/github/v1/pulls.proto";

option go_package = "github.com/HaikeiLabs/kei-connector-contracts/gen/go/kei/connectors/github/v1;github";

// GetIssueRequest reads a single issue from a GitHub repository.
message GetIssueRequest {
  string owner = 1 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];
  string repository = 2 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];
  int64 issue_number = 3 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];

  option (kei.contracts.v1.operation) = {
    id: "github.issues.get"
    connector: "github"
    class: OPERATION_CLASS_READ
    http_method: "GET"
    path_template: "/repos/{owner}/{repository}/issues/{issue_number}"
    scopes: ["issues:read"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
    method_name: "GetIssue"
    connections: ["user_oauth", "pat"]
    resource_template: "repos/{owner}/{repository}"
    semantics: {action: SEMANTIC_ACTION_READ resource_type: "issue" version: 1}
    errors: [
      {status: 401 kind: ERROR_KIND_UNAUTHORIZED},
      {status: 403 kind: ERROR_KIND_FORBIDDEN},
      {status: 404 kind: ERROR_KIND_NOT_FOUND},
      {status: 429 kind: ERROR_KIND_RATE_LIMITED retryable: true}
    ]
  };
}

// GetIssueResponse models the subset of the GitHub issue payload the
// contract needs. It is filled by JSON unmarshal of the provider response.
message GetIssueResponse {
  int64 id = 1;
  int64 number = 2;
  string title = 3;
  string state = 4;
  optional string body = 5;
  string html_url = 6;
  User author = 7 [json_name = "user"];
  repeated Label labels = 8;
}

// ListIssuesRequest lists the issues of a GitHub repository. The contract
// models only the state filter and the page size of the query parameters.
message ListIssuesRequest {
  string owner = 1 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];
  string repository = 2 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];
  optional string state = 3;
  optional int32 per_page = 4;

  option (kei.contracts.v1.operation) = {
    id: "github.issues.list"
    connector: "github"
    class: OPERATION_CLASS_READ
    http_method: "GET"
    path_template: "/repos/{owner}/{repository}/issues"
    scopes: ["issues:read"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
    method_name: "ListIssues"
    connections: ["user_oauth", "pat"]
    resource_template: "repos/{owner}/{repository}"
    semantics: {action: SEMANTIC_ACTION_READ resource_type: "issue" version: 1}
    errors: [
      {status: 401 kind: ERROR_KIND_UNAUTHORIZED},
      {status: 403 kind: ERROR_KIND_FORBIDDEN},
      {status: 404 kind: ERROR_KIND_NOT_FOUND},
      {status: 429 kind: ERROR_KIND_RATE_LIMITED retryable: true}
    ]
  };
}

// IssueSummary models the subset of each issue entry a list response carries.
message IssueSummary {
  int64 id = 1;
  int64 number = 2;
  string title = 3;
  string state = 4;
  optional string body = 5;
  string html_url = 6;
  User author = 7 [json_name = "user"];
  repeated Label labels = 8;
}

// ListIssuesResponse wraps the issue entries of a list response. GitHub
// returns a bare JSON array here; the contract envelopes it under issues so
// the response stays a protojson object and envelope keys stay
// drift-checkable. It is filled by JSON unmarshal of the provider response.
message ListIssuesResponse {
  repeated IssueSummary issues = 1;
}

// CreateIssueRequest creates an issue in a GitHub repository. The title is
// the provider's only required field; the contract models the body alongside
// it.
message CreateIssueRequest {
  string owner = 1 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];
  string repository = 2 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];
  string title = 3;
  optional string body = 4;

  option (kei.contracts.v1.operation) = {
    id: "github.issues.create"
    connector: "github"
    class: OPERATION_CLASS_WRITE
    http_method: "POST"
    path_template: "/repos/{owner}/{repository}/issues"
    scopes: ["issues:write"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
    method_name: "CreateIssue"
    connections: ["user_oauth", "pat"]
    resource_template: "repos/{owner}/{repository}"
    semantics: {action: SEMANTIC_ACTION_CREATE resource_type: "issue" version: 1}
    errors: [
      {status: 401 kind: ERROR_KIND_UNAUTHORIZED},
      {status: 403 kind: ERROR_KIND_FORBIDDEN},
      {status: 404 kind: ERROR_KIND_NOT_FOUND},
      {status: 429 kind: ERROR_KIND_RATE_LIMITED retryable: true},
      {status: 409 kind: ERROR_KIND_CONFLICT},
      {status: 422 kind: ERROR_KIND_INVALID}
    ]
  };
}

// CreateIssueResponse models the created issue. It is filled by JSON
// unmarshal of the provider response.
message CreateIssueResponse {
  int64 id = 1;
  int64 number = 2;
  string title = 3;
  string state = 4;
  optional string body = 5;
  string html_url = 6;
  User author = 7 [json_name = "user"];
  repeated Label labels = 8;
}

// CreateIssueCommentRequest writes a comment on a GitHub issue.
message CreateIssueCommentRequest {
  string owner = 1 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];
  string repository = 2 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];
  int64 issue_number = 3 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];
  string body = 4;

  option (kei.contracts.v1.operation) = {
    id: "github.issues.comments.create"
    connector: "github"
    class: OPERATION_CLASS_WRITE
    http_method: "POST"
    path_template: "/repos/{owner}/{repository}/issues/{issue_number}/comments"
    scopes: ["issues:write"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
    method_name: "CreateIssueComment"
    connections: ["user_oauth", "pat"]
    resource_template: "repos/{owner}/{repository}"
    semantics: {action: SEMANTIC_ACTION_CREATE resource_type: "issue_comment" version: 1}
    errors: [
      {status: 401 kind: ERROR_KIND_UNAUTHORIZED},
      {status: 403 kind: ERROR_KIND_FORBIDDEN},
      {status: 404 kind: ERROR_KIND_NOT_FOUND},
      {status: 429 kind: ERROR_KIND_RATE_LIMITED retryable: true},
      {status: 409 kind: ERROR_KIND_CONFLICT},
      {status: 422 kind: ERROR_KIND_INVALID}
    ]
  };
}

// CreateIssueCommentResponse models the created comment. It is filled by
// JSON unmarshal of the provider response.
message CreateIssueCommentResponse {
  int64 id = 1;
  string body = 2;
  string html_url = 3;
  User author = 4 [json_name = "user"];
}
