// Notion connector declaration: the connector id and the connection kinds
// its operations run over (proposal 0002, section 4.1).
syntax = "proto3";

package kei.connectors.notion.v1;

import "kei/contracts/v1/options.proto";

option go_package = "github.com/HaikeiLabs/kei-connector-contracts/gen/go/kei/connectors/notion/v1;notion";

// Notion connector and its connection kinds. A user's own OAuth token or an
// admin-configured integration token; both go on the wire as a bearer token.
//
// Every Notion API request also carries a fixed `Notion-Version` header
// (e.g. "2022-06-28") pinning the API version. It is NOT a credential: it is
// a constant header every caller sends and never carries a per-user or
// per-connection secret, so it is not modeled as a connection or setup field.
option (kei.contracts.v1.connector) = {
  id: "notion"
  base_url: "https://api.notion.com"
  connections: [
    {
      name: "user_oauth"
      kind: CONNECTION_KIND_HTTP_BEARER
      auth_method: "oauth"
      account_model: ACCOUNT_MODEL_PER_USER
    },
    {
      name: "integration_token"
      kind: CONNECTION_KIND_HTTP_BEARER
      auth_method: "secret_ref"
      account_model: ACCOUNT_MODEL_SHARED
      setup_fields: [{name: "token" type: "string" pattern: "^\\S+$" secret: true}]
    }
  ]
};
