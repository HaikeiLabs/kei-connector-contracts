// Notion connector contract.
syntax = "proto3";

package kei.connectors.notion.v1;

import "google/protobuf/struct.proto";

import "kei/contracts/v1/options.proto";

option go_package = "github.com/HaikeiLabs/kei-connector-contracts/gen/go/kei/connectors/notion/v1;notion";

// GetPageRequest reads a single page from Notion.
message GetPageRequest {
  string page_id = 1 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];

  option (kei.contracts.v1.operation) = {
    id: "notion.pages.get"
    connector: "notion"
    class: OPERATION_CLASS_READ
    http_method: "GET"
    path_template: "/v1/pages/{page_id}"
    scopes: ["pages:read"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
    method_name: "GetPage"
    connections: ["user_oauth", "integration_token"]
    resource_template: "pages/{page_id}"
    semantics: {action: SEMANTIC_ACTION_READ resource_type: "page" version: 1}
    errors: [
      {status: 401 kind: ERROR_KIND_UNAUTHORIZED},
      {status: 403 kind: ERROR_KIND_FORBIDDEN},
      {status: 404 kind: ERROR_KIND_NOT_FOUND},
      {status: 429 kind: ERROR_KIND_RATE_LIMITED retryable: true}
    ]
  };
}

// GetPageResponse models the subset of the Notion page payload the contract
// needs. public_url is null for pages not published to the web. It is filled
// by JSON unmarshal of the provider response.
message GetPageResponse {
  string id = 1;
  string created_time = 2;
  string last_edited_time = 3;
  bool archived = 4;
  string url = 5;
  optional string public_url = 6;
}

// CreatePageRequest creates a page in Notion. parent is the parent page or
// database reference in Notion's parent-object shape (for example
// {"type": "database_id", "database_id": "..."}); properties carries the
// page's properties in Notion's property-object shape, which is required
// when the parent is a database; children are the block objects appended to
// the page body. The three payloads are provider-shaped objects, so they are
// Structs rather than modeled fields.
message CreatePageRequest {
  google.protobuf.Struct parent = 1;
  google.protobuf.Struct properties = 2;
  repeated google.protobuf.Struct children = 3;

  option (kei.contracts.v1.operation) = {
    id: "notion.pages.create"
    connector: "notion"
    class: OPERATION_CLASS_WRITE
    destructive: false
    http_method: "POST"
    path_template: "/v1/pages"
    scopes: ["pages:write"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
    method_name: "CreatePage"
    result_required: ["id", "url"]
    connections: ["user_oauth", "integration_token"]
    resource_template: "pages"
    semantics: {action: SEMANTIC_ACTION_CREATE resource_type: "page" version: 1}
    errors: [
      {status: 400 kind: ERROR_KIND_INVALID},
      {status: 401 kind: ERROR_KIND_UNAUTHORIZED},
      {status: 403 kind: ERROR_KIND_FORBIDDEN},
      {status: 429 kind: ERROR_KIND_RATE_LIMITED retryable: true}
    ]
  };
}

// CreatePageResponse models the same page subset the read returns.
// It is filled by JSON unmarshal of the provider response.
message CreatePageResponse {
  string id = 1;
  string created_time = 2;
  string last_edited_time = 3;
  bool archived = 4;
  string url = 5;
  optional string public_url = 6;
}

// UpdatePageRequest updates a page's properties, or archives (soft-deletes)
// it. properties carries the property-object patch; archived and in_trash
// are Notion's two spellings of archive. Notion merges the patch, so this is
// not a wholesale overwrite and the operation is not destructive.
message UpdatePageRequest {
  string page_id = 1 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];
  google.protobuf.Struct properties = 2;
  optional bool archived = 3;
  optional bool in_trash = 4;

  option (kei.contracts.v1.operation) = {
    id: "notion.pages.update"
    connector: "notion"
    class: OPERATION_CLASS_WRITE
    destructive: false
    http_method: "PATCH"
    path_template: "/v1/pages/{page_id}"
    scopes: ["pages:write"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
    method_name: "UpdatePage"
    result_required: ["id", "url"]
    connections: ["user_oauth", "integration_token"]
    resource_template: "pages/{page_id}"
    semantics: {action: SEMANTIC_ACTION_UPDATE resource_type: "page" version: 1}
    errors: [
      {status: 400 kind: ERROR_KIND_INVALID},
      {status: 401 kind: ERROR_KIND_UNAUTHORIZED},
      {status: 403 kind: ERROR_KIND_FORBIDDEN},
      {status: 404 kind: ERROR_KIND_NOT_FOUND},
      {status: 429 kind: ERROR_KIND_RATE_LIMITED retryable: true}
    ]
  };
}

// UpdatePageResponse models the same page subset the read returns.
// It is filled by JSON unmarshal of the provider response.
message UpdatePageResponse {
  string id = 1;
  string created_time = 2;
  string last_edited_time = 3;
  bool archived = 4;
  string url = 5;
  optional string public_url = 6;
}
