// Sentry connector declaration: the connector id and the connection kinds
// its operations run over (proposal 0002, section 4.1).
syntax = "proto3";

package kei.connectors.sentry.v1;

import "kei/contracts/v1/options.proto";

option go_package = "github.com/HaikeiLabs/kei-connector-contracts/gen/go/kei/connectors/sentry/v1;sentry";

// Sentry connector and its connection kind. An auth token configured by an
// admin goes on the wire as a bearer token. The organization slug is a setup
// field, not a credential: it scopes which organization's API paths the
// connection may address.
option (kei.contracts.v1.connector) = {
  id: "sentry"
  base_url: "https://sentry.io"
  connections: [
    {
      name: "auth_token"
      kind: CONNECTION_KIND_HTTP_BEARER
      auth_method: "secret_ref"
      account_model: ACCOUNT_MODEL_SHARED
      setup_fields: [
        {name: "token" type: "string" pattern: "^\\S+$" secret: true},
        {name: "organization_slug" type: "string"}
      ]
    }
  ]
};
