// Atlassian connector contract: Confluence page reads.
syntax = "proto3";

package kei.connectors.atlassian.v1;

import "google/protobuf/struct.proto";
import "kei/contracts/v1/options.proto";

option go_package = "github.com/HaikeiLabs/kei-connector-contracts/gen/go/kei/connectors/atlassian/v1;atlassian";

// GetConfluencePageRequest reads a single page from a Confluence site.
message GetConfluencePageRequest {
  int64 page_id = 1 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];

  option (kei.contracts.v1.operation) = {
    id: "atlassian.confluence.pages.get"
    connector: "atlassian"
    class: OPERATION_CLASS_READ
    http_method: "GET"
    path_template: "/wiki/api/v2/pages/{page_id}"
    scopes: ["read:page:confluence"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
    method_name: "GetConfluencePage"
    connections: ["user_oauth", "api_token"]
    resource_template: "confluence/pages/{page_id}"
    semantics: {action: SEMANTIC_ACTION_READ resource_type: "page" version: 1}
    errors: [
      {status: 401 kind: ERROR_KIND_UNAUTHORIZED},
      {status: 403 kind: ERROR_KIND_FORBIDDEN},
      {status: 404 kind: ERROR_KIND_NOT_FOUND},
      {status: 429 kind: ERROR_KIND_RATE_LIMITED retryable: true}
    ]
  };
}

// GetConfluencePageResponse models the subset of the Confluence page payload
// the contract needs. parent_id is null on the wire for root pages. It is
// filled by JSON unmarshal of the provider response.
message GetConfluencePageResponse {
  int64 id = 1;
  string title = 2;
  string space_id = 3;
  optional string parent_id = 4;
}

// CreateConfluencePageRequest creates a page in a Confluence space. body
// carries the page content in Confluence's {representation, value} shape and
// stays a google.protobuf.Struct; the contract does not model the full
// version, label or ownership fields the v2 endpoint also accepts.
message CreateConfluencePageRequest {
  string space_id = 1;
  string title = 2;
  optional string parent_id = 3;
  google.protobuf.Struct body = 4;

  option (kei.contracts.v1.operation) = {
    id: "atlassian.confluence.pages.create"
    connector: "atlassian"
    class: OPERATION_CLASS_WRITE
    destructive: false
    http_method: "POST"
    path_template: "/wiki/api/v2/pages"
    scopes: ["write:page:confluence"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
    method_name: "CreateConfluencePage"
    result_required: ["id", "space_id"]
    connections: ["user_oauth", "api_token"]
    resource_template: "confluence/pages"
    semantics: {action: SEMANTIC_ACTION_CREATE resource_type: "page" version: 1}
    errors: [
      {status: 400 kind: ERROR_KIND_INVALID},
      {status: 401 kind: ERROR_KIND_UNAUTHORIZED},
      {status: 403 kind: ERROR_KIND_FORBIDDEN},
      {status: 429 kind: ERROR_KIND_RATE_LIMITED retryable: true}
    ]
  };
}

// CreateConfluencePageResponse models the same page subset the read returns.
// parent_id is null on the wire for root pages. It is filled by JSON
// unmarshal of the provider response.
message CreateConfluencePageResponse {
  int64 id = 1;
  string title = 2;
  string space_id = 3;
  optional string parent_id = 4;
}

// ListConfluencePagesRequest lists the pages of a Confluence space. The
// contract models only the page size of the query parameters.
message ListConfluencePagesRequest {
  int64 space_id = 1 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];
  optional int32 limit = 2;

  option (kei.contracts.v1.operation) = {
    id: "atlassian.confluence.pages.list"
    connector: "atlassian"
    class: OPERATION_CLASS_READ
    http_method: "GET"
    path_template: "/wiki/api/v2/spaces/{space_id}/pages"
    scopes: ["read:page:confluence"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
    method_name: "ListConfluencePages"
    connections: ["user_oauth", "api_token"]
    resource_template: "confluence/pages"
    semantics: {action: SEMANTIC_ACTION_READ resource_type: "page" version: 1}
    errors: [
      {status: 401 kind: ERROR_KIND_UNAUTHORIZED},
      {status: 403 kind: ERROR_KIND_FORBIDDEN},
      {status: 404 kind: ERROR_KIND_NOT_FOUND},
      {status: 429 kind: ERROR_KIND_RATE_LIMITED retryable: true}
    ]
  };
}

// ConfluencePageSummary models the subset of each page entry a list response
// carries.
message ConfluencePageSummary {
  int64 id = 1;
  string title = 2;
  string space_id = 3;
}

// ListConfluencePagesResponse wraps the page entries of a list response. The
// results key matches the provider shape; pagination follows the Link header
// like GitHub and is not modeled here. It is filled by JSON unmarshal of the
// provider response.
message ListConfluencePagesResponse {
  repeated ConfluencePageSummary results = 1;
}
