// Generic HTTP API connector declaration: the connector id and the connection kinds
// its operations run over (proposal 0002, section 4.1).
syntax = "proto3";

package kei.connectors.http_api.v1;

import "kei/contracts/v1/options.proto";

option go_package = "github.com/HaikeiLabs/kei-connector-contracts/gen/go/kei/connectors/http_api/v1;http_api";

// Generic HTTP API connector. The origin is configured per connector
// instance (setup field base_url); the API key goes on the wire as a bearer
// token.
option (kei.contracts.v1.connector) = {
  id: "http_api"
  connections: [{
    name: "api_key"
    kind: CONNECTION_KIND_HTTP_BEARER
    auth_method: "secret_ref"
    account_model: ACCOUNT_MODEL_SHARED
    base_url_field: "base_url"
    setup_fields: [
      {name: "base_url" type: "url" pattern: "^https://\\S+$"},
      {name: "api_key" type: "string" pattern: "^\\S+$" secret: true}
    ]
  }]
};
