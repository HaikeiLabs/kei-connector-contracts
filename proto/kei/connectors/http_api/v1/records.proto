// Generic HTTP API connector contract: records.
//
// The http_api connector fronts generic REST collections whose record shapes
// are provider-specific, so record bodies are google.protobuf.Struct: typed
// enough to audit, open enough to unmarshal any collection.
syntax = "proto3";

package kei.connectors.http_api.v1;

import "google/protobuf/struct.proto";
import "kei/contracts/v1/options.proto";

option go_package = "github.com/HaikeiLabs/kei-connector-contracts/gen/go/kei/connectors/http_api/v1;http_api";

// ListRecordsRequest lists the records of one collection.
message ListRecordsRequest {
  string collection = 1;
  optional int32 limit = 2;
  optional string cursor = 3;

  option (kei.contracts.v1.operation) = {
    id: "http_api.records.list"
    connector: "http_api"
    class: OPERATION_CLASS_READ
    http_method: "GET"
    path_template: "/{collection}"
    scopes: ["records:read"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
  };
}

// ListRecordsResponse models one page of a collection listing.
message ListRecordsResponse {
  repeated google.protobuf.Struct records = 1;
  optional string next_cursor = 2;
}

// GetRecordRequest reads one record of a collection.
message GetRecordRequest {
  string collection = 1;
  string record_id = 2;

  option (kei.contracts.v1.operation) = {
    id: "http_api.records.get"
    connector: "http_api"
    class: OPERATION_CLASS_READ
    http_method: "GET"
    path_template: "/{collection}/{record_id}"
    scopes: ["records:read"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
  };
}

// GetRecordResponse models one record body as a Struct.
message GetRecordResponse {
  google.protobuf.Struct record = 1;
}
