// HubSpot connector declaration: the connector id and the connection kinds
// its operations run over (proposal 0002, section 4.1).
syntax = "proto3";

package kei.connectors.hubspot.v1;

import "kei/contracts/v1/options.proto";

option go_package = "github.com/HaikeiLabs/kei-connector-contracts/gen/go/kei/connectors/hubspot/v1;hubspot";

// HubSpot connector and its connection kinds. A user's own OAuth token or an
// admin-configured private app token; both go on the wire as a bearer token.
option (kei.contracts.v1.connector) = {
  id: "hubspot"
  base_url: "https://api.hubapi.com"
  connections: [
    {
      name: "user_oauth"
      kind: CONNECTION_KIND_HTTP_BEARER
      auth_method: "oauth"
      account_model: ACCOUNT_MODEL_PER_USER
    },
    {
      name: "private_app"
      kind: CONNECTION_KIND_HTTP_BEARER
      auth_method: "secret_ref"
      account_model: ACCOUNT_MODEL_SHARED
      setup_fields: [{name: "token" type: "string" pattern: "^\\S+$" secret: true}]
    }
  ]
};
