// HubSpot connector contract.
syntax = "proto3";

package kei.connectors.hubspot.v1;

import "google/protobuf/struct.proto";
import "kei/contracts/v1/options.proto";

option go_package = "github.com/HaikeiLabs/kei-connector-contracts/gen/go/kei/connectors/hubspot/v1;hubspot";

// ListDealsRequest lists the deals of a HubSpot CRM account. after carries
// the page cursor returned by the previous call.
message ListDealsRequest {
  optional string after = 1;
  optional int32 limit = 2;

  option (kei.contracts.v1.operation) = {
    id: "hubspot.deals.list"
    connector: "hubspot"
    class: OPERATION_CLASS_READ
    http_method: "GET"
    path_template: "/crm/v3/objects/deals"
    scopes: ["crm.objects.deals.read"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
    method_name: "ListDeals"
    connections: ["user_oauth", "private_app"]
    resource_template: "deals"
    cursor_field: "after"
    next_cursor_field: "next_after"
    semantics: {action: SEMANTIC_ACTION_READ resource_type: "deal" version: 1}
    errors: [
      {status: 401 kind: ERROR_KIND_UNAUTHORIZED},
      {status: 403 kind: ERROR_KIND_FORBIDDEN},
      {status: 404 kind: ERROR_KIND_NOT_FOUND},
      {status: 429 kind: ERROR_KIND_RATE_LIMITED retryable: true}
    ]
  };
}

// DealSummary models the subset of each deal entry a list response carries.
// Deal properties are provider-specific, so the property body is a
// google.protobuf.Struct.
message DealSummary {
  string id = 1;
  google.protobuf.Struct properties = 2;
  string created_at = 3;
  string updated_at = 4;
  bool archived = 5;
}

// ListDealsResponse wraps the deal entries of a list response. It is filled
// by JSON unmarshal of the provider response.
message ListDealsResponse {
  repeated DealSummary results = 1;
  optional string next_after = 2;
}
