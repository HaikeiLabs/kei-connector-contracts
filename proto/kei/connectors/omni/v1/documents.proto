// Omni connector contract: documents.
//
// omni.documents.list pages through the documents of the Omni workspace.
// The page cursor travels on the request and the next cursor comes back on
// the response, so a caller walks the listing one page per call.
syntax = "proto3";

package kei.connectors.omni.v1;

import "kei/contracts/v1/options.proto";

option go_package = "github.com/HaikeiLabs/kei-connector-contracts/gen/go/kei/connectors/omni/v1;omni";

// ListDocumentsRequest lists the documents of the Omni workspace, one page
// per call.
message ListDocumentsRequest {
  optional string cursor = 1;

  option (kei.contracts.v1.operation) = {
    id: "omni.documents.list"
    connector: "omni"
    class: OPERATION_CLASS_READ
    http_method: "GET"
    path_template: "/api/v1/documents"
    scopes: ["documents:read"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
    method_name: "ListDocuments"
    connections: ["api_key"]
    resource_template: "documents"
    semantics: {action: SEMANTIC_ACTION_READ resource_type: "document" version: 1}
    cursor_field: "cursor"
    next_cursor_field: "next_cursor"
    errors: [
      {status: 401 kind: ERROR_KIND_UNAUTHORIZED},
      {status: 403 kind: ERROR_KIND_FORBIDDEN},
      {status: 404 kind: ERROR_KIND_NOT_FOUND},
      {status: 429 kind: ERROR_KIND_RATE_LIMITED retryable: true}
    ]
  };
}

// DocumentSummary models the subset of each document entry a list response
// carries.
message DocumentSummary {
  string id = 1;
  string name = 2;
  optional string updated_at = 3;
}

// ListDocumentsResponse wraps the document entries of one list page. Omni
// returns the entries under documents and the next cursor under
// next_cursor, absent on the last page. It is filled by JSON unmarshal of
// the provider response.
message ListDocumentsResponse {
  repeated DocumentSummary documents = 1;
  optional string next_cursor = 2;
}
