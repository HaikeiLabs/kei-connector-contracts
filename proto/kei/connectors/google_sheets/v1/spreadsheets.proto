// Google Sheets connector contract: spreadsheet and cell-value reads.
syntax = "proto3";

package kei.connectors.google_sheets.v1;

import "google/protobuf/struct.proto";
import "kei/contracts/v1/options.proto";

option go_package = "github.com/HaikeiLabs/kei-connector-contracts/gen/go/kei/connectors/google_sheets/v1;google_sheets";

// GetValuesRequest reads one A1-notation range of cell values. The range is
// a single path segment (multi_segment false): RenderPath escapes it with
// url.PathEscape, which keeps sub-delims like '!' and ':' literal — the
// range "Sheet1!A1:B2" renders unchanged — while '/' becomes %2F, so a
// value cannot change the path shape.
message GetValuesRequest {
  string spreadsheet_id = 1 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];
  string range = 2 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH multi_segment: false}];

  option (kei.contracts.v1.operation) = {
    id: "google_sheets.values.get"
    connector: "google_sheets"
    class: OPERATION_CLASS_READ
    http_method: "GET"
    path_template: "/v4/spreadsheets/{spreadsheet_id}/values/{range}"
    scopes: ["https://www.googleapis.com/auth/spreadsheets.readonly"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
    method_name: "GetValues"
    connections: ["user_oauth", "domain_delegation"]
    resource_template: "spreadsheets/{spreadsheet_id}"
    semantics: {action: SEMANTIC_ACTION_READ resource_type: "spreadsheet" version: 1}
    errors: [
      {status: 400 kind: ERROR_KIND_INVALID},
      {status: 401 kind: ERROR_KIND_UNAUTHORIZED},
      {status: 403 kind: ERROR_KIND_FORBIDDEN},
      {status: 404 kind: ERROR_KIND_NOT_FOUND},
      {status: 429 kind: ERROR_KIND_RATE_LIMITED retryable: true}
    ]
  };
}

// GetValuesResponse models the subset of the Sheets values payload the
// contract needs. rows are positional ListValues in column order; an empty
// cell is a null entry. It is filled by JSON unmarshal of the provider
// response.
message GetValuesResponse {
  string range = 1;
  repeated google.protobuf.ListValue values = 2;
}

// GetSpreadsheetRequest reads a single spreadsheet.
message GetSpreadsheetRequest {
  string spreadsheet_id = 1 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];

  option (kei.contracts.v1.operation) = {
    id: "google_sheets.spreadsheets.get"
    connector: "google_sheets"
    class: OPERATION_CLASS_READ
    http_method: "GET"
    path_template: "/v4/spreadsheets/{spreadsheet_id}"
    scopes: ["https://www.googleapis.com/auth/spreadsheets.readonly"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
    method_name: "GetSpreadsheet"
    connections: ["user_oauth", "domain_delegation"]
    resource_template: "spreadsheets/{spreadsheet_id}"
    semantics: {action: SEMANTIC_ACTION_READ resource_type: "spreadsheet" version: 1}
    errors: [
      {status: 401 kind: ERROR_KIND_UNAUTHORIZED},
      {status: 403 kind: ERROR_KIND_FORBIDDEN},
      {status: 404 kind: ERROR_KIND_NOT_FOUND},
      {status: 429 kind: ERROR_KIND_RATE_LIMITED retryable: true}
    ]
  };
}

// SpreadsheetProperties models the subset of the spreadsheet properties the
// contract needs.
message SpreadsheetProperties {
  string title = 1;
}

// GetSpreadsheetResponse models the subset of the Sheets spreadsheet payload
// the contract needs. It is filled by JSON unmarshal of the provider
// response.
message GetSpreadsheetResponse {
  string spreadsheet_id = 1;
  SpreadsheetProperties properties = 2;
}

// UpdateValuesRequest writes cell values into one A1-notation range. The
// range is a single path segment like the read's; values carries the rows to
// write in the same positional ListValue shape the read returns. Google
// overwrites every cell in the range, so this operation is destructive.
message UpdateValuesRequest {
  string spreadsheet_id = 1 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];
  string range = 2 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH multi_segment: false}];
  repeated google.protobuf.ListValue values = 3;

  option (kei.contracts.v1.operation) = {
    id: "google_sheets.values.update"
    connector: "google_sheets"
    class: OPERATION_CLASS_WRITE
    destructive: true
    http_method: "PUT"
    path_template: "/v4/spreadsheets/{spreadsheet_id}/values/{range}"
    scopes: ["https://www.googleapis.com/auth/spreadsheets"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
    method_name: "UpdateValues"
    connections: ["user_oauth", "domain_delegation"]
    resource_template: "spreadsheets/{spreadsheet_id}"
    semantics: {action: SEMANTIC_ACTION_UPDATE resource_type: "spreadsheet" version: 1}
    errors: [
      {status: 400 kind: ERROR_KIND_INVALID},
      {status: 401 kind: ERROR_KIND_UNAUTHORIZED},
      {status: 403 kind: ERROR_KIND_FORBIDDEN},
      {status: 404 kind: ERROR_KIND_NOT_FOUND},
      {status: 429 kind: ERROR_KIND_RATE_LIMITED retryable: true}
    ]
  };
}

// UpdateValuesResponse models the subset of the Sheets update response the
// contract needs. It is filled by JSON unmarshal of the provider response.
message UpdateValuesResponse {
  string spreadsheet_id = 1;
  string updated_range = 2;
  optional int32 updated_rows = 3;
  optional int32 updated_columns = 4;
  optional int32 updated_cells = 5;
}

// AppendValuesRequest appends rows after the last row of data in the range's
// table. The range is a single path segment like the read's; Google's
// `:append` method suffix is part of the path template. value_input_option
// and insert_data_option are query parameters; values carries the rows to
// append in the same positional ListValue shape the read returns. Google
// appends below existing data without touching it, so this operation is not
// destructive.
message AppendValuesRequest {
  string spreadsheet_id = 1 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH}];
  string range = 2 [(kei.contracts.v1.param) = {in: PARAM_IN_PATH multi_segment: false}];
  optional string value_input_option = 3 [(kei.contracts.v1.param) = {in: PARAM_IN_QUERY}];
  optional string insert_data_option = 4 [(kei.contracts.v1.param) = {in: PARAM_IN_QUERY}];
  repeated google.protobuf.ListValue values = 5;

  option (kei.contracts.v1.operation) = {
    id: "google_sheets.values.append"
    connector: "google_sheets"
    class: OPERATION_CLASS_WRITE
    destructive: false
    http_method: "POST"
    path_template: "/v4/spreadsheets/{spreadsheet_id}/values/{range}:append"
    scopes: ["https://www.googleapis.com/auth/spreadsheets"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
    method_name: "AppendValues"
    connections: ["user_oauth", "domain_delegation"]
    resource_template: "spreadsheets/{spreadsheet_id}"
    semantics: {action: SEMANTIC_ACTION_CREATE resource_type: "spreadsheet" version: 1}
    errors: [
      {status: 400 kind: ERROR_KIND_INVALID},
      {status: 401 kind: ERROR_KIND_UNAUTHORIZED},
      {status: 403 kind: ERROR_KIND_FORBIDDEN},
      {status: 404 kind: ERROR_KIND_NOT_FOUND},
      {status: 429 kind: ERROR_KIND_RATE_LIMITED retryable: true}
    ]
  };
}

// AppendValuesResponse models the subset of the Sheets append response the
// contract needs. table_range is the A1 range the values were found after;
// updates carries the effective write Google performed on the appended
// table. It is filled by JSON unmarshal of the provider response.
message AppendValuesResponse {
  string spreadsheet_id = 1;
  optional string table_range = 2;
  UpdateValuesResponse updates = 3;
}
