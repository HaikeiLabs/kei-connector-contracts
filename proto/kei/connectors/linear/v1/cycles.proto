// Linear connector contract: cycles.
//
// Linear is GraphQL over POST /graphql. Its schema uses camelCase keys;
// every field declared here already unmarshals under protojson's lowerCamel
// default, so no json_name is set anywhere in this file. The data envelope
// GraphQL wraps responses in is unwrapped by the harness; the contract
// models the payload object.
syntax = "proto3";

package kei.connectors.linear.v1;

import "kei/contracts/v1/options.proto";
import "kei/connectors/linear/v1/issues.proto";

option go_package = "github.com/HaikeiLabs/kei-connector-contracts/gen/go/kei/connectors/linear/v1;linear";

// Cycle models the subset of the Linear cycle object the contract needs.
message Cycle {
  string id = 1;
  int32 number = 2;
  string starts_at = 3;
  string ends_at = 4;
  bool is_active = 5;
}

// ListCyclesRequest lists the cycles of one Linear team. team_id filters the
// cycle connection to the team; after is the pagination cursor.
message ListCyclesRequest {
  string team_id = 1;
  optional int32 first = 2;
  optional string after = 3;

  option (kei.contracts.v1.operation) = {
    id: "linear.cycles.list"
    connector: "linear"
    class: OPERATION_CLASS_READ
    http_method: "POST"
    path_template: "/graphql"
    scopes: ["cycles:read"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
    graphql_document:
      "query ListCycles($teamId: String!, $first: Int, $after: String) {\n"
      "  cycles(first: $first, after: $after, filter: {team: {id: {eq: $teamId}}}) {\n"
      "    nodes { id number startsAt endsAt isActive }\n"
      "    pageInfo { hasNextPage endCursor }\n"
      "  }\n"
      "}\n"
    method_name: "ListCycles"
    connections: ["user_oauth", "api_key"]
    resource_template: "teams/{team_id}"
    semantics: {action: SEMANTIC_ACTION_READ resource_type: "cycle" version: 1}
    errors: [
      {status: 401 kind: ERROR_KIND_UNAUTHORIZED},
      {status: 403 kind: ERROR_KIND_FORBIDDEN},
      {status: 404 kind: ERROR_KIND_NOT_FOUND},
      {status: 429 kind: ERROR_KIND_RATE_LIMITED retryable: true}
    ]
  };
}

// ListCyclesResponse models the cycle connection the query returns.
message ListCyclesResponse {
  repeated Cycle nodes = 1;
  PageInfo page_info = 2;
}
