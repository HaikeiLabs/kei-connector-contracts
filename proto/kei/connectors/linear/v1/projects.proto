// Linear connector contract: projects.
//
// Linear is GraphQL over POST /graphql. Its schema uses camelCase keys;
// every field declared here already unmarshals under protojson's lowerCamel
// default, so no json_name is set anywhere in this file. The data envelope
// GraphQL wraps responses in is unwrapped by the harness; the contract
// models the payload object.
syntax = "proto3";

package kei.connectors.linear.v1;

import "kei/contracts/v1/options.proto";
import "kei/connectors/linear/v1/issues.proto";

option go_package = "github.com/HaikeiLabs/kei-connector-contracts/gen/go/kei/connectors/linear/v1;linear";

// Project models the subset of the Linear project object the contract needs.
message Project {
  string id = 1;
  string name = 2;
  optional string description = 3;
  string url = 4;
}

// ListProjectsRequest lists the Linear projects of the workspace. after is
// the pagination cursor.
message ListProjectsRequest {
  optional int32 first = 1;
  optional string after = 2;

  option (kei.contracts.v1.operation) = {
    id: "linear.projects.list"
    connector: "linear"
    class: OPERATION_CLASS_READ
    http_method: "POST"
    path_template: "/graphql"
    scopes: ["projects:read"]
    credential_placement: CREDENTIAL_PLACEMENT_HEADER_BEARER
    graphql_document:
      "query ListProjects($first: Int, $after: String) {\n"
      "  projects(first: $first, after: $after) {\n"
      "    nodes { id name description url }\n"
      "    pageInfo { hasNextPage endCursor }\n"
      "  }\n"
      "}\n"
    method_name: "ListProjects"
    connections: ["user_oauth", "api_key"]
    resource_template: "projects"
    semantics: {action: SEMANTIC_ACTION_READ resource_type: "project" version: 1}
    errors: [
      {status: 401 kind: ERROR_KIND_UNAUTHORIZED},
      {status: 403 kind: ERROR_KIND_FORBIDDEN},
      {status: 404 kind: ERROR_KIND_NOT_FOUND},
      {status: 429 kind: ERROR_KIND_RATE_LIMITED retryable: true}
    ]
  };
}

// ListProjectsResponse models the project connection the query returns.
message ListProjectsResponse {
  repeated Project nodes = 1;
  PageInfo page_info = 2;
}
