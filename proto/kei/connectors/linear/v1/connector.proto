// Linear connector declaration: the connector id and the connection kinds
// its operations run over (proposal 0002, section 4.1).
syntax = "proto3";

package kei.connectors.linear.v1;

import "kei/contracts/v1/options.proto";

option go_package = "github.com/HaikeiLabs/kei-connector-contracts/gen/go/kei/connectors/linear/v1;linear";

// Linear connector and its connection kinds. A user's OAuth token goes on
// the wire as a bearer token; a Linear API key goes in the Authorization
// header as is, with no scheme.
option (kei.contracts.v1.connector) = {
  id: "linear"
  base_url: "https://api.linear.app"
  connections: [
    {
      name: "user_oauth"
      kind: CONNECTION_KIND_HTTP_BEARER
      auth_method: "oauth"
      account_model: ACCOUNT_MODEL_PER_USER
    },
    {
      name: "api_key"
      kind: CONNECTION_KIND_HTTP_HEADER
      auth_method: "secret_ref"
      account_model: ACCOUNT_MODEL_SHARED
      header_name: "Authorization"
      setup_fields: [{name: "api_key" type: "string" pattern: "^\\S+$" secret: true}]
    }
  ]
};
