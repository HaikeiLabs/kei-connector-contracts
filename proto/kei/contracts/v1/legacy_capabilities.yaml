# Legacy capability mapping (proposal 0002, section 8.1): each coarse catalog
# capability and the operation ids it covers. The policy catalog rewrites
# existing grants with it once, recording every rewrite in its audit log.
#
# Rules, enforced by protoc-gen-kei-manifest:
# - The mapping never widens a grant: a ".read" capability maps only to read
#   operations, every other verb only to write operations, and never to a
#   destructive operation.
# - A row lists only operations that exist. A coarse capability whose
#   operations are not all in the contracts yet is left out: it stays on its
#   policies unchanged and is added in the release that adds its operations.
# - Capabilities with no operation at all stay out.

- connector: github
  capability: check.read
  operations: [github.checks.runs.list]

- connector: github
  capability: issue.comment
  operations: [github.issues.comments.create]

- connector: github
  capability: issue.create
  operations: [github.issues.create]

- connector: github
  capability: issue.read
  operations: [github.issues.get, github.issues.list]

- connector: github
  capability: issue.update
  operations: [github.issues.update]

- connector: github
  capability: pull_request.create
  operations: [github.pulls.create]

- connector: github
  capability: pull_request.read
  operations: [github.pulls.get, github.pulls.list, github.pulls.reviews.list]

- connector: github
  capability: pull_request.update
  operations: [github.pulls.update]

- connector: github
  capability: repository.read
  operations: [github.repos.get]

- connector: github
  capability: workflow.read
  operations: [github.actions.runs.list]

- connector: linear
  capability: comment.create
  operations: [linear.comments.create]

- connector: linear
  capability: cycle.read
  operations: [linear.cycles.list]

- connector: linear
  capability: issue.create
  operations: [linear.issues.create]

- connector: linear
  capability: issue.read
  operations: [linear.issues.get, linear.issues.search]

- connector: linear
  capability: issue.update
  operations: [linear.issues.update]

- connector: linear
  capability: project.read
  operations: [linear.projects.list]

- connector: linear
  capability: team.read
  operations: [linear.teams.get]
