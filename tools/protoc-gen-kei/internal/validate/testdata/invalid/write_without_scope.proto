// Invalid: a write operation declares no scope.
syntax = "proto3";

package kei.invalid.writewithoutscope.v1;

import "kei/contracts/v1/options.proto";

option go_package = "example.test/invalid/writewithoutscope;writewithoutscope";
option (kei.contracts.v1.connector) = {
  id: "acme"
  base_url: "https://api.example.test"
  connections: [{name: "pat" kind: CONNECTION_KIND_HTTP_BEARER account_model: ACCOUNT_MODEL_SHARED}]
};

message CreateThingRequest {
  string name = 1;
  option (kei.contracts.v1.operation) = {
    id: "acme.things.create"
    connector: "acme"
    class: OPERATION_CLASS_WRITE
    http_method: "POST"
    path_template: "/things"
    connections: ["pat"]
    semantics: {action: SEMANTIC_ACTION_CREATE resource_type: "thing" version: 1}
  };
}
message CreateThingResponse {}
