[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haikeilabs-connector-contracts"
version = "0.20.3"
description = "Generated connector operation contracts"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["protobuf>=7.36.2,<8"]

[project.urls]
Repository = "https://github.com/HaikeiLabs/kei-connector-contracts"

[project.optional-dependencies]
# The http_connection adapter wraps an httpx.AsyncClient. Everything else in
# the runtime is stdlib + protobuf only.
httpx = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kei*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.pyi"]
