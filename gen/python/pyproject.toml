[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haikeilabs-connector-contracts"
version = "0.1.0"
description = "Generated connector operation contracts"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["protobuf>=7.36.2,<8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kei*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.pyi"]
