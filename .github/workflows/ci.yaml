name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    # ubuntu-latest, not the self-hosted pool: this module has no AWS or cluster
    # dependency, and a hosted runner avoids the org runner-group grant that new
    # repositories do not get by default.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test -count=1 -race ./...

      - name: License headers present
        # Apache 2.0 does not strictly require per-file headers, but this
        # repository is public and its files are meant to be read and copied by
        # third-party connector authors. A file that travels on its own should
        # carry its licence with it.
        run: bash scripts/license-header.sh --check

      - name: Contract stays dependency-light
        # ADR-017: this module must not acquire database, handler, credential, or
        # provider-execution dependencies. It is imported by every service, so a
        # dependency here propagates everywhere.
        run: |
          if grep -qE '^\s*require' go.mod; then
            echo "ERROR: go.mod gained a require block."
            echo "The connector contract is deliberately stdlib-only."
            cat go.mod
            exit 1
          fi
          echo "OK: no third-party dependencies"

  proto:
    name: Proto toolchain
    # Same hosted-runner rationale as the verify job: buf, Go and Rust only,
    # no AWS or cluster dependency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so .git#branch=main is resolvable for buf breaking.
          fetch-depth: 0

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Lint
        run: buf lint

      - name: Breaking change check
        # The proto module is new on this branch; until main carries proto/
        # there is no baseline to break against.
        run: |
          if git cat-file -e main:proto 2>/dev/null; then
            buf breaking --against '.git#branch=main'
          else
            echo "proto/ does not exist on main yet; skipping breaking check"
          fi

      - name: Generate
        run: buf generate

      - name: Generated code is committed and in sync
        # Both a modified tracked file and a brand-new untracked file mean the
        # committed generation is stale.
        run: |
          untracked=$(git ls-files --others --exclude-standard gen/)
          if [ -n "$untracked" ]; then
            echo "buf generate produced untracked files under gen/:"
            echo "$untracked"
            exit 1
          fi
          git diff --exit-code

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: gen/go/go.sum

      - name: Go registry tests
        run: go test -count=1 ./...
        working-directory: gen/go

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust serde tests
        run: cargo test
        working-directory: gen/rust
