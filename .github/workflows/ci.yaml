name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly, so the four-database testenv proof also runs when no PR touches
    # the testenv files (e.g. image tag drift or runner changes).
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    # ubuntu-latest, not the self-hosted pool: this module has no AWS or cluster
    # dependency, and a hosted runner avoids the org runner-group grant that new
    # repositories do not get by default.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test -count=1 -race ./...

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python tests
        # The generated python module (HAI-990) needs a protobuf runtime at
        # least as new as the generated code (gencode 7.36.2); pytest is the
        # runner. PYTHONPATH points at the generated package root.
        run: |
          pip install 'protobuf>=7.36.2' pytest
          PYTHONPATH=gen/python/src python -m pytest -q gen/python/tests

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: TypeScript tests and build
        working-directory: gen/ts
        run: |
          npm ci
          npm test
          npm run build

      - name: License headers present
        # Apache 2.0 does not strictly require per-file headers, but this
        # repository is public and its files are meant to be read and copied by
        # third-party connector authors. A file that travels on its own should
        # carry its licence with it.
        run: bash scripts/license-header.sh --check

      - name: Contract stays dependency-light
        # ADR-017: this module must not acquire database, handler, credential, or
        # provider-execution dependencies. It is imported by every service, so a
        # dependency here propagates everywhere.
        run: |
          if grep -qE '^\s*require' go.mod; then
            echo "ERROR: go.mod gained a require block."
            echo "The connector contract is deliberately stdlib-only."
            cat go.mod
            exit 1
          fi
          echo "OK: no third-party dependencies"

  proto:
    name: Proto toolchain
    # Same hosted-runner rationale as the verify job: buf, Go and Rust only,
    # no AWS or cluster dependency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so .git#branch=main is resolvable for buf breaking.
          fetch-depth: 0

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      # Before buf generate: protoc-gen-kei-ops and protoc-gen-kei-manifest
      # are local plugins buf runs with go run (tools/protoc-gen-kei).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: |
            gen/go/go.sum
            tools/protoc-gen-kei/go.sum

      - name: Lint
        run: buf lint

      - name: Plugin tests
        # Validation rules, per-language golden files, the manifest schema,
        # legacy mapping and manifest-diff rules (proposal 0002).
        run: |
          go -C tools/protoc-gen-kei vet ./...
          go -C tools/protoc-gen-kei test -count=1 ./...

      - name: Breaking change check
        # The proto module is new on this branch; until main carries proto/
        # there is no baseline to break against.
        run: |
          if git cat-file -e main:proto 2>/dev/null; then
            buf breaking --against '.git#branch=main'
          else
            echo "proto/ does not exist on main yet; skipping breaking check"
          fi

      - name: Generate
        run: buf generate

      - name: Generated code is committed and in sync
        # Both a modified tracked file and a brand-new untracked file mean the
        # committed generation is stale.
        run: |
          untracked=$(git ls-files --others --exclude-standard gen/ manifest/)
          if [ -n "$untracked" ]; then
            echo "buf generate produced untracked files under gen/ or manifest/:"
            echo "$untracked"
            exit 1
          fi
          git diff --exit-code

      - name: Manifest breaking check against the last release
        # Proposal 0002, section 6: option values are invisible to buf
        # breaking, so the manifest is compared with the last v* tag's. A
        # rename passes only with the old id deprecated and replaced_by set.
        run: |
          bash scripts/manifest-diff_test.sh
          tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$tag" ] || ! git cat-file -e "$tag:manifest/connector-manifest.v1.json" 2>/dev/null; then
            echo "The last release tag (${tag:-none}) has no manifest; nothing to compare yet"
            exit 0
          fi
          git show "$tag:manifest/connector-manifest.v1.json" > "$RUNNER_TEMP/released-manifest.json"
          bash scripts/manifest-diff.sh "$RUNNER_TEMP/released-manifest.json" manifest/connector-manifest.v1.json

      - name: Go registry tests
        run: go test -count=1 ./...
        working-directory: gen/go

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust serde tests
        run: cargo test
        working-directory: gen/rust

  parity:
    name: Cross-language parity
    # Proposal 0002, section 11: every operation runs through each language's
    # generated code against one recording server; requests and decoded
    # results must match Go's. All four languages are required
    # (requiredParityLanguages in gen/go/conformance/parity_test.go): a
    # missing toolchain fails the job instead of skipping a language.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: gen/go/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build the TypeScript package
        working-directory: gen/ts
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python runner dependencies
        run: pip install 'protobuf>=7.36.2' 'httpx>=0.27,<1'

      - uses: dtolnay/rust-toolchain@stable

      - name: Parity test
        env:
          KEI_PARITY: "1"
        run: go -C gen/go test -count=1 ./conformance -run TestParity_AllLanguages -v

  testenv:
    name: Database testenv
    # ubuntu-latest is amd64 and ships docker; the mssql image is amd64-only
    # (see testenv/compose.yaml) and the proof needs no cloud credentials.
    runs-on: ubuntu-latest
    env:
      CONTAINER_CLI: docker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: gen/go/go.sum

      - name: Start database stack
        # mssql sits behind the "mssql" profile in compose.yaml; --profile
        # mssql opts it in so all four dialects run. The mssql-seed sidecar
        # must be named explicitly: depends_on only pulls dependencies in, so
        # naming mssql alone never creates the seed (it waits for mssql to be
        # healthy, then runs).
        run: docker compose -f testenv/compose.yaml --profile mssql up -d postgres supabase mysql mssql mssql-seed

      - name: Wait for databases to be healthy (max 120s)
        run: |
          compose() { docker compose -f testenv/compose.yaml --profile mssql "$@"; }
          healthy=0
          for i in $(seq 1 60); do
            healthy=$(compose ps postgres supabase mysql mssql --format '{{.Health}}' | grep -c '^healthy$' || true)
            if [ "$healthy" -eq 4 ]; then
              echo "All four database services healthy."
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 4 ]; then
            compose ps -a
            echo "Timed out waiting for the database services to become healthy."
            exit 1
          fi

      - name: Wait for the mssql seed sidecar (max 60s)
        run: |
          compose() { docker compose -f testenv/compose.yaml --profile mssql "$@"; }
          cid=""
          # Fail fast (≈10s) if the seed container was never created instead
          # of looping on an empty id; dump the compose state to show why.
          for i in $(seq 1 5); do
            cid=$(compose ps -aq mssql-seed)
            if [ -n "$cid" ]; then
              break
            fi
            if [ "$i" -lt 5 ]; then
              sleep 2
            fi
          done
          if [ -z "$cid" ]; then
            compose ps -a
            echo "mssql-seed container was never created; is it named in the up command?"
            exit 1
          fi
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Status}}/{{.State.ExitCode}}' "$cid" || true)
            if [ "$state" = "exited/0" ]; then
              echo "mssql seed applied."
              exit 0
            fi
            if [ "$state" = "exited/1" ]; then
              compose logs --tail 50 mssql-seed
              echo "mssql seed failed."
              exit 1
            fi
            sleep 2
          done
          echo "Timed out waiting for the mssql seed sidecar."
          exit 1

      - name: Contract proof against the real databases
        run: go -C gen/go test -count=1 -tags testenv ./conformance -run TestEnvDatabaseQueryRun -v

      - name: Tear down
        if: always()
        run: docker compose -f testenv/compose.yaml --profile mssql down -v --remove-orphans
