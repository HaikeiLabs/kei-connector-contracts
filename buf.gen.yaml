# Remote plugins for the message types, plus the local protoc-gen-kei-ops
# plugin (tools/protoc-gen-kei, its own Go module) for the generated
# operations; buf runs it with the Go toolchain. Output paths are the roots of
# the per-language modules under gen/.
version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/python
    out: gen/python/src
  - remote: buf.build/protocolbuffers/pyi
    out: gen/python/src
  - remote: buf.build/bufbuild/es
    out: gen/ts/src
    opt:
      - target=ts
      - import_extension=js
  - remote: buf.build/community/neoeinstein-prost
    out: gen/rust/src/gen
    opt:
      - compile_well_known_types
      - extern_path=.google.protobuf=::pbjson_types
  - remote: buf.build/community/neoeinstein-prost-serde
    out: gen/rust/src/gen
    opt:
      - ignore_unknown_fields
      - extern_path=.google.protobuf=::pbjson_types
  # Generated operations (proposal 0002). strategy: all gives the plugin every
  # file at once, so it validates all operations against all connectors.
  - local: ["go", "-C", "tools/protoc-gen-kei", "run", "./cmd/protoc-gen-kei-ops"]
    out: gen/go
    strategy: all
    opt:
      - paths=source_relative
      - lang=go
  - local: ["go", "-C", "tools/protoc-gen-kei", "run", "./cmd/protoc-gen-kei-ops"]
    out: gen/ts/src
    strategy: all
    opt:
      - paths=source_relative
      - lang=ts
  - local: ["go", "-C", "tools/protoc-gen-kei", "run", "./cmd/protoc-gen-kei-ops"]
    out: gen/rust/src
    strategy: all
    opt:
      - paths=source_relative
      - lang=rust
  - local: ["go", "-C", "tools/protoc-gen-kei", "run", "./cmd/protoc-gen-kei-ops"]
    out: gen/python/src
    strategy: all
    opt:
      - paths=source_relative
      - lang=python
  # The connector manifest (proposal 0002, section 4.6). Bump
  # contracts_version with each release tag. The legacy path is relative to
  # tools/protoc-gen-kei, where go -C runs the plugin.
  - local: ["go", "-C", "tools/protoc-gen-kei", "run", "./cmd/protoc-gen-kei-manifest"]
    out: manifest
    strategy: all
    opt:
      - contracts_version=v0.20.0
      - legacy=../../proto/kei/contracts/v1/legacy_capabilities.yaml
